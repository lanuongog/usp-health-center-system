<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Laucala Health Center - Manage Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #F4F8F8;
--panel: #FFFFFF;
--ink: #14213D;
--ink-soft: #5C7070;
--line: #D8E6E6;
--brand: #0D7377;
--brand-dark: #095558;
--brand-soft: #E3F1F1;
}
* { box-sizing: border-box; }
body { font-family: 'Geist', -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); margin: 0; color: var(--ink); }
header { background: var(--brand); color: white; padding: 18px 30px; font-size: 20px; font-weight: 600; }
header a.home-link { color: #fff; text-decoration: none; opacity: 0.85; margin-right: 14px; font-size: 14px; }
header a.home-link:hover { opacity: 1; text-decoration: underline; }
.container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

button { background: var(--brand); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
button:hover { background: var(--brand-dark); }
button.secondary { background: #9ca3af; }
button.secondary:hover { background: #6b7280; }
button.danger { background: #B03A2E; padding: 6px 12px; font-size: 12px; }
button.danger:hover { background: #8A2C22; }
button.small { padding: 6px 12px; font-size: 12px; }
#pageError { background: #FDEAEA; color: #B03A2E; border: 1px solid #f2b8b8; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
#formError { color: #B03A2E; font-size: 13px; margin-top: 10px; display: none; }

#app { display: block; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.panel { background: var(--panel); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.panel h3 { margin-top: 0; color: var(--brand); font-size: 15px; }

.newSlotForm { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
.newSlotForm label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
.newSlotForm input { padding: 7px; border: 1px solid var(--line); border-radius: 6px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-soft); font-weight: 600; }
.status-badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.status-badge.open { background: var(--brand-soft); color: var(--brand-dark); }
.status-badge.booked { background: #FDEAEA; color: #B03A2E; }
</style>
</head>
<body>

<header><a href="/" id="home-link" class="home-link">← Home</a> Laucala Online Appointment &amp; Medical Records System &mdash; Manage Schedule</header>

<div class="container">

<div id="app">
<div class="topbar">
<h2 style="color:var(--brand);margin:0;">Manage Consultation Schedule</h2>
<button class="secondary" onclick="logout()">Log Out</button>
</div>

<div id="pageError"></div>

<div class="panel">
<h3>Add New Slot</h3>
<div class="newSlotForm">
<div><label>Doctor Name</label><input type="text" id="newDoctorName" placeholder="Dr. Patel" maxlength="100"></div>
<div><label>Date</label><input type="date" id="newDate"></div>
<div><label>Time Slot</label><input type="text" id="newTimeSlot" placeholder="09:00 AM - 09:30 AM" maxlength="50"></div>
<button onclick="createSlot()">Add Slot</button>
</div>
<div id="formError"></div>
</div>

<div class="panel">
<h3>Current Schedule</h3>
<table>
<thead><tr><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead>
<tbody id="scheduleTableBody"></tbody>
</table>
</div>
</div>

</div>

<script>
// ---- shared input validation helpers (client-side; the server re-checks everything) ----
const VAL = {
  _last: {},
  // returns false if the same action fired again within ms (stops double-click submits)
  once(key, ms) {
    const now = Date.now();
    if (this._last[key] && now - this._last[key] < (ms || 2000)) return false;
    this._last[key] = now;
    return true;
  },
  today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); },
  vitals(temp, bp) {
    const t = Number(String(temp).trim());
    if (String(temp).trim() === '' || !isFinite(t)) return 'Temperature must be a number in degrees Celsius (e.g. 37.2).';
    if (t < 30 || t > 43) return 'Temperature is out of the valid range (30\u201343 \u00B0C).';
    const m = /^(\d{2,3})\s*\/\s*(\d{2,3})$/.exec(String(bp).trim());
    if (!m) return 'Blood pressure must be in the format systolic/diastolic (e.g. 120/80).';
    const s = parseInt(m[1], 10), d = parseInt(m[2], 10);
    if (s < 60 || s > 250 || d < 40 || d > 150) return 'Blood pressure is out of the valid range (systolic 60\u2013250, diastolic 40\u2013150).';
    if (d >= s) return 'Systolic pressure must be higher than diastolic pressure.';
    return null;
  },
  password(pw, username) {
    if (!pw) return 'A password is required.';
    if (pw.length < 6 || pw.length > 100) return 'Password must be between 6 and 100 characters.';
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Password must contain at least one letter and one number.';
    if (/\s/.test(pw)) return 'Password cannot contain spaces.';
    if (username && pw.toLowerCase() === String(username).toLowerCase()) return 'Password cannot be the same as the username.';
    return null;
  }
};
</script>
<script>
let authHeader = null;

window.addEventListener('DOMContentLoaded', () => {
  const storedAuth = localStorage.getItem('authHeader');
  const storedRole = localStorage.getItem('userRole');

  if (!storedAuth || (storedRole !== 'DOCTOR' && storedRole !== 'ADMIN')) {
    window.location.href = '/login.html';
    return;
  }

  if (storedRole === 'ADMIN') {
    const homeLink = document.getElementById('home-link');
    homeLink.href = '/admin.html';
    homeLink.textContent = '← Back to Admin Dashboard';
  }

  authHeader = storedAuth;
  loadSchedule();
});

function logout() {
  localStorage.clear();
  window.location.href = '/login.html';
}

// Auth here is stateless (Basic Auth cached in localStorage), so there's no
// server-side session to expire - this client-side idle timer is what
// actually enforces the "auto-logoff after inactivity" requirement.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
let idleTimer;
function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    localStorage.clear();
    window.location.href = '/login.html?reason=idle';
  }, IDLE_TIMEOUT_MS);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt =>
  document.addEventListener(evt, resetIdleTimer, { passive: true })
);
resetIdleTimer();

function showPageError(message) {
  const box = document.getElementById('pageError');
  box.innerText = message;
  box.style.display = message ? 'block' : 'none';
}

function showFormError(message) {
  const box = document.getElementById('formError');
  box.innerText = message;
  box.style.display = message ? 'block' : 'none';
}

async function loadSchedule() {
  try {
    const res = await fetch('/schedule/manage', { headers: { 'Authorization': authHeader } });
    if (!res.ok) {
      const err = await res.json();
      showPageError(err.message || 'Unable to load schedule');
      return;
    }
    showPageError(null);
    const slots = await res.json();
    const body = document.getElementById('scheduleTableBody');

    if (slots.length === 0) {
      body.innerHTML = '<tr><td colspan="5" style="color:#9ca3af;">No schedule slots yet.</td></tr>';
      return;
    }

    body.innerHTML = slots.map(s => `
      <tr>
        <td>${s.doctorName}</td>
        <td>${s.scheduleDate}</td>
        <td>${s.timeSlot}</td>
        <td><span class="status-badge ${s.booked ? 'booked' : 'open'}">${s.booked ? 'Booked' : 'Open'}</span></td>
        <td>${s.booked ? '' : `<button class="danger" onclick="deleteSlot(${s.id})">Remove</button>`}</td>
      </tr>
    `).join('');
  } catch (e) {
    showPageError('Service temporarily unavailable');
  }
}

async function createSlot() {
  const doctorName = document.getElementById('newDoctorName').value;
  const date = document.getElementById('newDate').value;
  const timeSlot = document.getElementById('newTimeSlot').value;

  if (!doctorName.trim() || !date || !timeSlot.trim()) {
    showFormError('Doctor name, date and time slot are all required.');
    return;
  }
  if (doctorName.trim().length > 100 || timeSlot.trim().length > 50) {
    showFormError('Doctor name must be 100 characters or fewer and time slot 50 or fewer.');
    return;
  }
  if (date < VAL.today()) {
    showFormError('Schedule date cannot be in the past.');
    return;
  }
  if (!/^\d{1,2}:\d{2}\s*(AM|PM)\s*-\s*\d{1,2}:\d{2}\s*(AM|PM)$/i.test(timeSlot.trim())) {
    showFormError('Time slot must look like "09:00 AM - 09:30 AM".');
    return;
  }
  if (!confirm('Create a slot for ' + doctorName.trim() + ' on ' + date + ', ' + timeSlot.trim() + '?')) return;
  if (!VAL.once('createslot', 2500)) return;

  try {
    const res = await fetch('/schedule/manage', {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctorName, scheduleDate: date, timeSlot })
    });

    if (!res.ok) {
      const err = await res.json();
      showFormError(err.message || 'Unable to create slot');
      return;
    }

    showFormError(null);
    document.getElementById('newDoctorName').value = '';
    document.getElementById('newDate').value = '';
    document.getElementById('newTimeSlot').value = '';
    loadSchedule();
  } catch (e) {
    showFormError('Service temporarily unavailable');
  }
}

async function deleteSlot(id) {
  if (!confirm('Remove this slot? Students will no longer be able to book it.')) return;
  if (!VAL.once('delslot' + id, 2500)) return;
  try {
    const res = await fetch(`/schedule/manage/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': authHeader }
    });

    if (!res.ok) {
      const err = await res.json();
      showPageError(err.message || 'Unable to remove slot');
      return;
    }

    showPageError(null);
    loadSchedule();
  } catch (e) {
    showPageError('Service temporarily unavailable');
  }
}
</script>

</body>
</html>
