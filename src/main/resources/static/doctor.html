<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Dashboard — USP Health Center</title>
<style>
  :root {
    --bg: #F5F7F8;
    --panel: #FFFFFF;
    --ink: #1B2B33;
    --ink-soft: #5C707A;
    --line: #DCE3E6;
    --brand: #1F4E5F;
    --brand-soft: #E5EEF0;
    --emergency: #B23A2E;
    --emergency-bg: #FBEAE8;
    --urgent: #B8721E;
    --urgent-bg: #FBF1E1;
    --routine: #3E6E85;
    --routine-bg: #E7EFF2;
    --ok: #3D7A55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .topbar {
    background: var(--brand);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .topbar .who {
    font-size: 13px;
    color: #CFE0E6;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .topbar button:hover { background: rgba(255,255,255,0.1); }

  /* Login screen */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 36px 32px;
    width: 320px;
    box-shadow: 0 1px 3px rgba(20,40,50,0.06);
  }
  .login-card .mark {
    width: 40px;
    height: 4px;
    background: var(--brand);
    border-radius: 2px;
    margin-bottom: 18px;
  }
  .login-card h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }
  .login-card p.sub {
    margin: 0 0 22px;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  .field input:focus {
    outline: 2px solid var(--brand);
    outline-offset: 1px;
    border-color: var(--brand);
  }
  .btn-primary {
    width: 100%;
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #173C49; }
  .error-text {
    color: var(--emergency);
    font-size: 12.5px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* App layout */
  #app-screen { display: none; }
  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    padding: 22px 24px;
    max-width: 1180px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .panel-head h2 {
    font-size: 15px;
    margin: 0;
  }
  .panel-head .count {
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* Queue rows — triage board styling */
  .queue-row {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s;
  }
  .queue-row:last-child { border-bottom: none; }
  .queue-row:hover { background: var(--brand-soft); }
  .queue-row.selected { background: var(--brand-soft); }
  .flag {
    width: 6px;
    flex-shrink: 0;
  }
  .flag.Emergency { background: var(--emergency); }
  .flag.Urgent { background: var(--urgent); }
  .flag.Routine { background: var(--routine); }
  .row-body {
    padding: 13px 16px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row-main .name {
    font-size: 14.5px;
    font-weight: 600;
  }
  .row-main .reason {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.Emergency { background: var(--emergency-bg); color: var(--emergency); }
  .badge.Urgent { background: var(--urgent-bg); color: var(--urgent); }
  .badge.Routine { background: var(--routine-bg); color: var(--routine); }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  /* Detail panel */
  #detail-panel .panel-body { padding: 18px; }
  .detail-placeholder {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .detail-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .detail-sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    font-weight: 700;
    margin: 18px 0 8px;
  }
  .section-label:first-of-type { margin-top: 0; }
  .history-item {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12.5px;
  }
  .history-item .h-top {
    display: flex;
    justify-content: space-between;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .history-item .h-meta { color: var(--ink-soft); }
  .history-loading, .history-empty {
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  textarea, .diag-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 70px; margin-top: 8px; }
  .btn-record {
    width: 100%;
    background: var(--ok);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-record:hover { background: #2F5F42; }
  .btn-record:disabled { background: #A9B7BC; cursor: not-allowed; }
  .toast {
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
  }
  .toast.ok { color: var(--ok); }
  .toast.err { color: var(--emergency); }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="mark"></div>
    <h2>Doctor Dashboard</h2>
    <p class="sub">USP Health Center — sign in to view your consultation queue.</p>
    <div class="field">
      <label for="login-username">Username</label>
      <input id="login-username" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" />
    </div>
    <button class="btn-primary" onclick="login()">Log in</button>
    <div class="error-text" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app-screen">
  <div class="topbar">
    <h1>Doctor Dashboard</h1>
    <div class="who">
      <span id="who-label"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel" id="queue-panel">
      <div class="panel-head">
        <h2>Patient Queue</h2>
        <span class="count" id="queue-count"></span>
      </div>
      <div id="queue-list"></div>
    </div>

    <div class="panel" id="detail-panel">
      <div class="panel-head">
        <h2>Consultation</h2>
      </div>
      <div class="panel-body" id="detail-body">
        <div class="detail-placeholder">Select a patient from the queue to view their details and record a consultation.</div>
      </div>
    </div>
  </div>
</div>

<script>
  let authHeader = null;
  let currentUsername = null;
  let selectedAppointment = null;

  function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    if (!username || !password) {
      errorEl.textContent = 'Enter both username and password.';
      return;
    }

    fetch('/api/check-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, requiredRole: 'DOCTOR' })
    })
      .then(res => res.json())
      .then(checkData => {
        if (!checkData.ok) {
          throw new Error(checkData.message);
        }
        authHeader = 'Basic ' + btoa(username + ':' + password);
        currentUsername = username;
        return fetch('/doctor/queue', { headers: { 'Authorization': authHeader } });
      })
      .then(res => {
        if (!res) return; // already threw above
        if (!res.ok) throw new Error('Unable to load patient queue');
        return res.json();
      })
      .then(queue => {
        if (!queue) return;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('who-label').textContent = currentUsername;
        renderQueue(queue);
      })
      .catch(err => {
        errorEl.textContent = err.message || 'Service temporarily unavailable';
      });
  }

  function logout() {
    authHeader = null;
    currentUsername = null;
    selectedAppointment = null;
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-password').value = '';
    document.getElementById('detail-body').innerHTML =
      '<div class="detail-placeholder">Select a patient from the queue to view their details and record a consultation.</div>';
  }

  function refreshQueue() {
    fetch('/doctor/queue', { headers: { 'Authorization': authHeader } })
      .then(res => res.json())
      .then(renderQueue)
      .catch(() => {
        document.getElementById('queue-list').innerHTML =
          '<div class="empty-state">Unable to load patient queue.</div>';
      });
  }

  function renderQueue(queue) {
    const listEl = document.getElementById('queue-list');
    const countEl = document.getElementById('queue-count');
    countEl.textContent = queue.length + (queue.length === 1 ? ' patient' : ' patients');

    if (queue.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No patients currently waiting.</div>';
      return;
    }

    listEl.innerHTML = queue.map(appt => `
      <div class="queue-row ${selectedAppointment && selectedAppointment.id === appt.id ? 'selected' : ''}"
           onclick='selectPatient(${JSON.stringify(appt)})'>
        <div class="flag ${appt.urgencyLevel}"></div>
        <div class="row-body">
          <div class="row-main">
            <div class="name">${escapeHtml(appt.studentName)}</div>
            <div class="reason">${escapeHtml(appt.visitReason)} · ${escapeHtml(appt.doctorName)}</div>
          </div>
          <span class="badge ${appt.urgencyLevel}">${appt.urgencyLevel}</span>
        </div>
      </div>
    `).join('');
  }

  function selectPatient(appt) {
    selectedAppointment = appt;
    refreshQueue();

    const body = document.getElementById('detail-body');
    body.innerHTML = `
      <div class="detail-name">${escapeHtml(appt.studentName)}</div>
      <div class="detail-sub">${escapeHtml(appt.visitReason)} · ${escapeHtml(appt.urgencyLevel)} · ${escapeHtml(appt.doctorName)}</div>

      <div class="section-label">Medical History</div>
      <div id="history-box"><div class="history-loading">Loading history…</div></div>

      <div class="section-label">Record Consultation</div>
      <input class="diag-input" id="diagnosis-input" placeholder="Diagnosis" />
      <textarea id="notes-input" placeholder="Consultation notes"></textarea>
      <button class="btn-record" id="record-btn" onclick="recordConsultation(${appt.id})">Save & complete consultation</button>
      <div class="toast" id="record-toast"></div>
    `;

    fetch('/doctor/history/' + encodeURIComponent(appt.studentName), { headers: { 'Authorization': authHeader } })
      .then(res => res.json())
      .then(history => {
        const box = document.getElementById('history-box');
        const past = history.filter(h => h.id !== appt.id);
        if (past.length === 0) {
          box.innerHTML = '<div class="history-empty">No previous visits on record.</div>';
          return;
        }
        box.innerHTML = past.map(h => `
          <div class="history-item">
            <div class="h-top"><span>${escapeHtml(h.visitReason)}</span><span>${escapeHtml(h.appointmentDate)}</span></div>
            <div class="h-meta">${escapeHtml(h.status)}${h.diagnosis ? ' · ' + escapeHtml(h.diagnosis) : ''}</div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('history-box').innerHTML =
          '<div class="history-empty">Unable to load medical record.</div>';
      });
  }

  function recordConsultation(appointmentId) {
    const diagnosis = document.getElementById('diagnosis-input').value.trim();
    const notes = document.getElementById('notes-input').value.trim();
    const toast = document.getElementById('record-toast');
    const btn = document.getElementById('record-btn');

    if (!diagnosis || !notes) {
      toast.textContent = 'Diagnosis and notes are both required.';
      toast.className = 'toast err';
      return;
    }

    btn.disabled = true;
    toast.textContent = '';

    fetch('/doctor/consultation', {
      method: 'POST',
      headers: {
        'Authorization': authHeader,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ appointmentId, diagnosis, consultationNotes: notes })
    })
      .then(res => {
        if (!res.ok) {
          return res.json().then(err => { throw new Error(err.message || 'Unable to save consultation record'); });
        }
        return res.json();
      })
      .then(() => {
        toast.textContent = 'Saved. Patient marked as completed.';
        toast.className = 'toast ok';
        selectedAppointment = null;
        setTimeout(() => {
          document.getElementById('detail-body').innerHTML =
            '<div class="detail-placeholder">Select a patient from the queue to view their details and record a consultation.</div>';
          refreshQueue();
        }, 900);
      })
      .catch(err => {
        toast.textContent = err.message;
        toast.className = 'toast err';
        btn.disabled = false;
      });
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>

</body>
</html>
