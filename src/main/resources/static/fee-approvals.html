<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Approvals — USP Health Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
</head>
<body>

<div class="app">
<div class="app-main">
<main class="app-content">

<!-- ================= FEE CHANGES ================= -->
<section data-view="approvals">
  <div class="page-head">
    <div>
      <h1>Fee changes</h1>
      <p>Admins propose changes to the Health Services Fee. A change only takes effect once you approve it.</p>
    </div>
    <button class="btn" onclick="loadOverview()"><span data-icon="refresh"></span>Refresh</button>
  </div>
  <div id="pageMsg" class="form-msg" style="margin:0 0 20px;"></div>

  <div class="stack" style="max-width:760px;">
    <div class="card absence-card" id="pending-card" hidden>
      <div class="absence-head"><h2>Waiting for your approval</h2><span class="pill amber">Not in effect yet</span></div>
      <div id="pending-body" style="margin-top:12px;"></div>
      <div class="field" style="margin-top:16px;">
        <label for="rejectNote">Reason, if you reject it</label>
        <textarea id="rejectNote" rows="2" maxlength="500" placeholder="e.g. Not yet approved by Finance — resubmit after the Council meeting"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="approve-btn" onclick="decide('approve')">Approve — apply new fees</button>
        <button class="btn" id="reject-btn" onclick="decide('reject')">Reject</button>
      </div>
    </div>
    <div class="card" id="none-card" hidden>
      <div class="empty">No fee changes are waiting for approval.</div>
    </div>

    <div class="card">
      <h2>Current Health Services Fee</h2>
      <div style="margin-top:12px;" id="current-body"></div>
    </div>

    <div class="card">
      <h2>Fee change history</h2>
      <div id="history-body"></div>
    </div>
  </div>
</section>

</main>
</div>
</div>

<!-- Change password -->
<div class="modal-overlay" id="change-password-modal-overlay" hidden onclick="if (event.target === this) closeChangePasswordModal()">
  <div class="modal-box">
    <div class="modal-head"><h2>Change password</h2><button class="modal-close" aria-label="Close" onclick="closeChangePasswordModal()">✕</button></div>
    <div class="field"><label for="cpCurrentPassword">Current password</label><input type="password" id="cpCurrentPassword" /></div>
    <div class="field"><label for="cpNewPassword">New password <span class="unit">(min 6 characters)</span></label><input type="password" id="cpNewPassword" minlength="6" maxlength="100" /></div>
    <div class="field"><label for="cpConfirmPassword">Confirm new password</label><input type="password" id="cpConfirmPassword" minlength="6" maxlength="100" /></div>
    <div class="toast" id="cpResult"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="submitChangePassword()">Change password</button>
      <button class="btn" onclick="closeChangePasswordModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/app-shell.js"></script>
<script src="/js/fee-changes.js"></script>
<script>
const esc = HC.esc;
let authHeader = null;
let currentUser = null;
let pending = null;

window.addEventListener('DOMContentLoaded', () => {
  const storedAuth = localStorage.getItem('authHeader');
  const storedRole = localStorage.getItem('userRole');
  if (!storedAuth || storedRole !== 'FEE_APPROVER') {
    window.location.href = '/login.html';
    return;
  }
  authHeader = storedAuth;
  currentUser = localStorage.getItem('currentUser');

  const staff = Shell.staff('FEE_APPROVER');
  Shell.mount({
    workspace: staff.workspace,
    nav: staff.nav,
    user: currentUser,
    alerts: 'none',
    defaultView: 'approvals',
    onView(view) {
      if (view === 'approvals') loadOverview();
    }
  });
  loadOverview();
  // Picks up a new proposal without a manual refresh (in-app only, no email).
  setInterval(loadOverview, 30000);
});

function logout() {
  localStorage.clear();
  window.location.href = '/login.html';
}

// Auth here is stateless (Basic Auth cached in localStorage), so there's no
// server-side session to expire - this client-side idle timer is what
// actually enforces the "auto-logoff after inactivity" requirement.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
let idleTimer;
function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    localStorage.clear();
    window.location.href = '/login.html?reason=idle';
  }, IDLE_TIMEOUT_MS);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt =>
  document.addEventListener(evt, resetIdleTimer, { passive: true })
);
resetIdleTimer();

function showMsg(kind, text) {
  const el = document.getElementById('pageMsg');
  el.className = 'form-msg ' + kind;
  el.textContent = text;
}

// ---------- Fee changes ----------
async function loadOverview() {
  try {
    const res = await fetch('/fee-approvals', { headers: { 'Authorization': authHeader } });
    if (!res.ok) throw new Error('load failed');
    const data = await res.json();
    const wasId = pending ? pending.id : null;
    pending = data.pending;
    Shell.setAlertCount(pending ? 1 : 0);
    document.getElementById('current-body').innerHTML = FeeChanges.currentHtml(data.current);
    document.getElementById('history-body').innerHTML = FeeChanges.historyHtml(data.history);
    document.getElementById('none-card').hidden = !!pending;
    document.getElementById('pending-card').hidden = !pending;
    if (!pending) return;
    // The server says when this account may not decide (it proposed the change).
    const blocked = data.blockedReason;
    document.getElementById('pending-body').innerHTML = FeeChanges.changeRows(pending)
      + `<p class="small" style="margin-top:10px;"><strong>Reason:</strong> ${esc(pending.reason)}</p>
         <p class="tiny muted">Proposed by ${esc(pending.proposedBy)} · ${esc(HC.fmtDateTime(pending.proposedAt))}</p>
         ${blocked ? `<p class="small" style="margin-top:8px;">${esc(blocked)}</p>` : ''}`;
    document.getElementById('approve-btn').disabled = !!blocked;
    document.getElementById('reject-btn').disabled = !!blocked;
    if (wasId !== pending.id) document.getElementById('rejectNote').value = '';
  } catch (e) {
    showMsg('err', 'Unable to load fee changes.');
  }
}

async function decide(action) {
  if (!pending) return;
  const note = document.getElementById('rejectNote').value.trim();
  if (action === 'reject' && !note) { showMsg('err', 'Give a reason for rejecting so the admin knows what to change.'); return; }
  const question = action === 'approve'
    ? `Approve the new fees (local ${FeeChanges.money(pending.proposedLocalFee)}, regional ${FeeChanges.money(pending.proposedRegionalFee)})? Students who register from now on will be charged these amounts.`
    : 'Reject this fee change? The current fees stay as they are.';
  if (!confirm(question)) return;
  try {
    const res = await fetch(`/fee-approvals/${pending.id}/${action}`, {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify({ note })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('err', data.message || 'Unable to record your decision.'); return; }
    showMsg('ok', action === 'approve' ? 'Approved. The new fees now apply to new registrations.' : 'Rejected. The admin can see your reason on the Fees page.');
    loadOverview();
  } catch (e) {
    showMsg('err', 'Service temporarily unavailable');
  }
}

// ---------- Change password ----------
function openChangePasswordModal() {
  ['cpCurrentPassword', 'cpNewPassword', 'cpConfirmPassword'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('cpResult').textContent = '';
  document.getElementById('change-password-modal-overlay').hidden = false;
}

function closeChangePasswordModal() {
  document.getElementById('change-password-modal-overlay').hidden = true;
}

function submitChangePassword() {
  const currentPassword = document.getElementById('cpCurrentPassword').value;
  const newPassword = document.getElementById('cpNewPassword').value;
  const confirmPassword = document.getElementById('cpConfirmPassword').value;
  const resultEl = document.getElementById('cpResult');
  if (!currentPassword || !newPassword) { resultEl.className = 'toast err'; resultEl.textContent = 'Both fields are required.'; return; }
  if (newPassword !== confirmPassword) { resultEl.className = 'toast err'; resultEl.textContent = 'New password and confirmation do not match.'; return; }

  fetch('/account/change-password', {
    method: 'POST',
    headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) { resultEl.className = 'toast err'; resultEl.textContent = data.error; return; }
    resultEl.className = 'toast ok';
    resultEl.textContent = data.message;
    setTimeout(closeChangePasswordModal, 1500);
  })
  .catch(() => { resultEl.className = 'toast err'; resultEl.textContent = 'Unable to reach the server.'; });
}
</script>
</body>
</html>
