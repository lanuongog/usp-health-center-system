<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Account — USU Health Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
<style>
.confirm-panel { background: var(--panel-muted); border-radius: var(--radius); padding: 16px; margin-top: 18px; }
.confirm-panel .cp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.confirm-panel h3 { font-size: 14px; font-weight: 600; }
.user-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .user-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>

<div class="app">
<div class="app-main">
<main class="app-content">
  <section data-view="user">
    <div class="page-head">
      <div>
        <a class="back" href="/admin.html#accounts">← Back to accounts</a>
        <h1 id="user-title">Manage account</h1>
        <p>Account metadata and payment verification only. No clinical data is shown or granted here.</p>
      </div>
    </div>
    <div id="pageError" class="notice danger" style="margin-bottom:20px;" hidden></div>
    <div id="pageMsg" class="notice ok" style="margin-bottom:20px;" hidden></div>
    <div class="grid-2 user-grid" id="content"></div>
  </section>
</main>
</div>
</div>

<!-- Change password (own account) -->
<div class="modal-overlay" id="change-password-modal-overlay" hidden onclick="if (event.target === this) closeChangePasswordModal()">
  <div class="modal-box">
    <div class="modal-head"><h2>Change password</h2><button class="modal-close" aria-label="Close" onclick="closeChangePasswordModal()">✕</button></div>
    <div class="field"><label for="cpCurrentPassword">Current password</label><input type="password" id="cpCurrentPassword" /></div>
    <div class="field"><label for="cpNewPassword">New password <span class="unit">(min 6 characters)</span></label><input type="password" id="cpNewPassword" minlength="6" maxlength="100" /></div>
    <div class="field"><label for="cpConfirmPassword">Confirm new password</label><input type="password" id="cpConfirmPassword" minlength="6" maxlength="100" /></div>
    <div class="toast" id="cpResult"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="submitChangePassword()">Change password</button>
      <button class="btn" onclick="closeChangePasswordModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/app-shell.js"></script>
<script>
const esc = HC.esc;
let authHeader = null;
let userId = null;
let currentUser = null;
let panel = null; // which inline confirmation panel is open: 'toggle' | 'reset' | 'reject' | null
let toggleWarning = '';

window.addEventListener('DOMContentLoaded', () => {
  const storedAuth = localStorage.getItem('authHeader');
  const storedRole = localStorage.getItem('userRole');
  if (!storedAuth || storedRole !== 'ADMIN') {
    window.location.href = '/login.html';
    return;
  }
  authHeader = storedAuth;

  const staff = Shell.staff('ADMIN');
  Shell.mount({
    workspace: staff.workspace,
    foot: staff.foot,
    nav: staff.nav,
    user: localStorage.getItem('currentUser'),
    alerts: 'none',
    activeKey: 'accounts'
  });

  userId = new URLSearchParams(window.location.search).get('id');
  if (!userId) { showError('No user was specified.'); return; }
  loadUser();
});

function logout() {
  localStorage.clear();
  window.location.href = '/login.html';
}

// Auth here is stateless (Basic Auth cached in localStorage), so there's no
// server-side session to expire - this client-side idle timer is what
// actually enforces the "auto-logoff after inactivity" requirement.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
let idleTimer;
function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    localStorage.clear();
    window.location.href = '/login.html?reason=idle';
  }, IDLE_TIMEOUT_MS);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt =>
  document.addEventListener(evt, resetIdleTimer, { passive: true })
);
resetIdleTimer();

function showError(message) {
  const box = document.getElementById('pageError');
  box.textContent = message || '';
  box.hidden = !message;
  if (message) document.getElementById('pageMsg').hidden = true;
}

function showMsg(message) {
  const box = document.getElementById('pageMsg');
  box.textContent = message || '';
  box.hidden = !message;
}

function roleLabel(r) {
  return { STUDENT: 'Student', DOCTOR: 'Doctor', NURSE: 'Nurse', ADMIN: 'Admin' }[r] || r;
}

async function loadUser() {
  try {
    const res = await fetch(`/admin/users/${userId}`, { headers: { 'Authorization': authHeader } });
    if (!res.ok) { showError('Unable to load this user account.'); return; }
    currentUser = await res.json();
    showError(null);
    render();
  } catch (e) {
    showError('Service temporarily unavailable');
  }
}

function openPanel(name) {
  panel = panel === name ? null : name;
  if (name !== 'toggle') toggleWarning = '';
  render();
  const input = document.querySelector('.confirm-panel input, .confirm-panel textarea');
  if (input) input.focus();
}

function render() {
  const u = currentUser;
  const isStudent = u.role === 'STUDENT';
  const pending = u.hasReceipt && !u.feePaid;
  document.getElementById('user-title').textContent = u.username;

  const kv = (k, v) => `<div class="kv"><span>${k}</span><strong>${v}</strong></div>`;
  const statusPill = u.active ? '<span class="pill teal">Active</span>' : '<span class="pill">Inactive</span>';

  let togglePanel = '';
  if (panel === 'toggle') {
    togglePanel = `
      <div class="confirm-panel">
        <div class="cp-head"><h3>${esc(u.username)} · ${esc(roleLabel(u.role))} account</h3>${statusPill}</div>
        <p class="small">${toggleWarning ? esc(toggleWarning) : `${u.active ? 'Deactivate' : 'Activate'} access for this account? No clinical data is shown or granted by this panel.`}</p>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn ${u.active ? 'btn-danger' : 'btn-primary'}" onclick="toggleActive(${toggleWarning ? 'true' : 'false'})">${u.active ? 'Deactivate account' : 'Activate account'}</button>
          <button class="btn" onclick="openPanel(null)">Cancel</button>
        </div>
      </div>`;
  }
  let resetPanel = '';
  if (panel === 'reset') {
    resetPanel = `
      <div class="confirm-panel">
        <h3>Reset password</h3>
        <div class="field" style="margin-top:12px;"><label for="resetPw">New password <span class="unit">(min 6 characters)</span></label><input type="password" id="resetPw" minlength="6" maxlength="100" /></div>
        <div class="btn-row"><button class="btn btn-primary" onclick="resetPassword()">Reset password</button><button class="btn" onclick="openPanel(null)">Cancel</button></div>
      </div>`;
  }

  const accountCard = `
    <div class="card">
      <h2>Account details</h2>
      <p class="card-sub">Account metadata only</p>
      <div style="margin-top:12px;">
        ${kv('Account ID', esc(u.username))}
        ${kv('Full name', esc(u.fullName) || '—')}
        ${kv('Role', esc(roleLabel(u.role)))}
        ${kv('Status', statusPill)}
      </div>
      <div class="btn-row" style="margin-top:18px;">
        ${u.role === 'ADMIN'
          ? '<span class="small muted">Admin accounts cannot be activated or deactivated here.</span>'
          : `<button class="btn${u.active ? '' : ' btn-primary'}" onclick="openPanel('toggle')">${u.active ? 'Deactivate' : 'Activate'}</button>`}
        <button class="btn" onclick="openPanel('reset')">Reset password</button>
      </div>
      ${togglePanel}${resetPanel}
    </div>`;

  let paymentCard = '';
  if (isStudent) {
    const actions = [];
    if (u.hasReceipt) actions.push('<button class="btn" onclick="viewReceipt()">View receipt</button>');
    if (pending) {
      actions.push('<button class="btn btn-primary" onclick="approveReceipt()">Approve payment</button>');
      actions.push(`<button class="btn btn-ghost" style="color:var(--emergency);" onclick="openPanel('reject')">Reject receipt</button>`);
    } else if (u.hasReceipt && u.feePaid) {
      actions.push(`<button class="btn btn-ghost" style="color:var(--emergency);" onclick="openPanel('reject')">Revoke verification</button>`);
    }
    const rejectPanel = panel === 'reject' ? `
      <div class="confirm-panel">
        <h3>${u.feePaid ? 'Revoke verification' : 'Reject receipt'}</h3>
        <div class="field" style="margin-top:12px;"><label for="rejectReason">Reason (shown to the student)</label><textarea id="rejectReason" rows="2" maxlength="300"></textarea></div>
        <div class="btn-row"><button class="btn btn-danger" onclick="rejectReceipt()">${u.feePaid ? 'Revoke' : 'Reject'}</button><button class="btn" onclick="openPanel(null)">Cancel</button></div>
      </div>` : '';
    paymentCard = `
      <div class="card">
        <h2>Payment status</h2>
        <p class="card-sub">Laucala Health Services Fee</p>
        <div style="margin-top:12px;">
          ${kv('Country', esc(u.country) || '—')}
          ${kv('Marital status', esc(u.maritalStatus) || '—')}
          ${kv('Fee amount', u.feeAmount != null ? 'FJ$' + Number(u.feeAmount).toFixed(2) : '—')}
          ${kv('Status', HC.feePill(u))}
          ${kv('Receipt uploaded', u.hasReceipt ? 'Yes' : 'No')}
        </div>
        ${u.receiptAutoCheckNote ? `<div class="notice info" style="margin-top:14px;">${esc(u.receiptAutoCheckNote)}</div>` : ''}
        ${u.receiptRejectionReason ? `<div class="notice danger" style="margin-top:14px;"><strong>Last rejection reason</strong><span class="notice-body">${esc(u.receiptRejectionReason)}</span></div>` : ''}
        ${actions.length ? `<div class="btn-row" style="margin-top:18px;">${actions.join('')}</div>` : ''}
        ${rejectPanel}
      </div>`;
  }

  document.getElementById('content').innerHTML = accountCard + paymentCard;
}

async function toggleActive(confirmed) {
  try {
    const res = await fetch(`/admin/users/${userId}/toggle`, {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: confirmed })
    });
    if (!res.ok) {
      const err = await res.json();
      showError(err.message || 'Unable to update account');
      return;
    }
    const result = await res.json();
    if (result.requiresConfirmation) {
      // The server wants an explicit second confirmation - show its warning in the panel.
      toggleWarning = result.message;
      panel = 'toggle';
      render();
      return;
    }
    panel = null;
    toggleWarning = '';
    showError(null);
    showMsg('Account status updated.');
    loadUser();
  } catch (e) {
    showError('Service temporarily unavailable');
  }
}

async function viewReceipt() {
  try {
    const res = await fetch(`/admin/users/${userId}/receipt`, { headers: { 'Authorization': authHeader } });
    if (!res.ok) { showError('Unable to load this receipt.'); return; }
    const blob = await res.blob();
    window.open(URL.createObjectURL(blob), '_blank');
  } catch (e) {
    showError('Service temporarily unavailable');
  }
}

async function approveReceipt() {
  try {
    const res = await fetch(`/admin/users/${userId}/verify-receipt`, { method: 'POST', headers: { 'Authorization': authHeader } });
    const data = await res.json();
    if (!res.ok || data.error) { showError(data.error || 'Unable to approve this receipt.'); return; }
    showError(null);
    showMsg('Payment approved. The student can now book appointments.');
    currentUser = data;
    panel = null;
    render();
  } catch (e) {
    showError('Service temporarily unavailable');
  }
}

async function resetPassword() {
  const newPassword = document.getElementById('resetPw').value;
  if (newPassword.length < 6) { showError('Password must be at least 6 characters.'); return; }
  try {
    const res = await fetch(`/admin/users/${userId}/reset-password`, {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify({ newPassword })
    });
    const data = await res.json();
    if (!res.ok || data.error) { showError(data.error || 'Unable to reset password.'); return; }
    showError(null);
    showMsg(data.message);
    panel = null;
    render();
  } catch (e) {
    showError('Service temporarily unavailable');
  }
}

async function rejectReceipt() {
  const reason = document.getElementById('rejectReason').value.trim();
  try {
    const res = await fetch(`/admin/users/${userId}/reject-receipt`, {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason })
    });
    const data = await res.json();
    if (!res.ok || data.error) { showError(data.error || 'Unable to reject this receipt.'); return; }
    showError(null);
    showMsg('Receipt rejected. The student can upload a new one.');
    currentUser = data;
    panel = null;
    render();
  } catch (e) {
    showError('Service temporarily unavailable');
  }
}

// ---------- Change password (own account) ----------
function openChangePasswordModal() {
  ['cpCurrentPassword', 'cpNewPassword', 'cpConfirmPassword'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('cpResult').textContent = '';
  document.getElementById('change-password-modal-overlay').hidden = false;
}

function closeChangePasswordModal() {
  document.getElementById('change-password-modal-overlay').hidden = true;
}

function submitChangePassword() {
  const currentPassword = document.getElementById('cpCurrentPassword').value;
  const newPassword = document.getElementById('cpNewPassword').value;
  const confirmPassword = document.getElementById('cpConfirmPassword').value;
  const resultEl = document.getElementById('cpResult');
  if (!currentPassword || !newPassword) { resultEl.className = 'toast err'; resultEl.textContent = 'Both fields are required.'; return; }
  if (newPassword !== confirmPassword) { resultEl.className = 'toast err'; resultEl.textContent = 'New password and confirmation do not match.'; return; }

  fetch('/account/change-password', {
    method: 'POST',
    headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) { resultEl.className = 'toast err'; resultEl.textContent = data.error; return; }
    resultEl.className = 'toast ok';
    resultEl.textContent = data.message;
    setTimeout(closeChangePasswordModal, 1500);
  })
  .catch(() => { resultEl.className = 'toast err'; resultEl.textContent = 'Unable to reach the server.'; });
}
</script>
</body>
</html>
