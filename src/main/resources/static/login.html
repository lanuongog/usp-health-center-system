<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laucala Health Center — Portal Login & Student Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #F4F8F8;
--panel: #FFFFFF;
--ink: #14213D;
--ink-soft: #5C7070;
--line: #D8E6E6;
--brand: #0D7377;
--brand-dark: #095558;
--brand-soft: #E3F1F1;
--footer-bg: #0F2B2E;
--footer-text: #C7DBDB;
--card-bg: #ffffff;
--card-border: #e2e8f0;
--text-main: #1e293b;
--text-muted: #64748b;
--text-sub: #475569;
--danger: #dc2626;
--danger-bg: #fef2f2;
--success: #16a34a;
--success-bg: #f0fdf4;
--radius: 12px;
--shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
background: linear-gradient(135deg, var(--footer-bg) 0%, var(--brand-dark) 50%, var(--brand) 100%);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 24px 16px;
color: var(--text-main);
}

.header-brand {
text-align: center;
color: #ffffff;
margin-bottom: 24px;
}

.header-brand .emblem {
display: inline-flex;
align-items: center;
justify-content: center;
width: 52px;
height: 52px;
background: rgba(255, 255, 255, 0.15);
backdrop-filter: blur(8px);
border: 1px solid rgba(255, 255, 255, 0.3);
border-radius: 14px;
margin-bottom: 12px;
font-size: 24px;
}

.header-brand h1 {
font-size: 24px;
font-weight: 700;
letter-spacing: -0.5px;
color: #ffffff;
}

.header-brand p {
font-size: 14px;
color: #cbd5e1;
margin-top: 4px;
}

.login-card {
background: var(--card-bg);
width: 100%;
max-width: 440px;
border-radius: var(--radius);
box-shadow: var(--shadow);
border: 1px solid rgba(255, 255, 255, 0.6);
overflow: hidden;
}

.card-tabs {
display: flex;
background: #f1f5f9;
padding: 6px;
border-radius: 10px;
margin: 24px 28px 16px;
gap: 4px;
}

.tab-btn {
flex: 1;
padding: 10px;
border: none;
background: transparent;
border-radius: 7px;
font-size: 14px;
font-weight: 600;
color: var(--text-muted);
cursor: pointer;
transition: all 0.2s ease;
font-family: inherit;
}

.tab-btn.active {
background: #ffffff;
color: var(--brand);
box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
}

.form-container {
padding: 12px 28px 28px;
}

.field-group {
margin-bottom: 16px;
}

.field-group label {
display: block;
font-size: 13px;
font-weight: 600;
color: var(--text-sub);
margin-bottom: 6px;
}

.input-wrapper {
position: relative;
display: flex;
align-items: center;
}

.input-wrapper input {
width: 100%;
padding: 12px 14px;
border: 1.5px solid var(--card-border);
border-radius: 9px;
font-size: 14px;
font-family: inherit;
color: var(--text-main);
background: #ffffff;
transition: border-color 0.2s, box-shadow 0.2s;
}

.input-wrapper input:focus {
outline: none;
border-color: var(--brand);
box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.15);
}

.input-wrapper select {
width: 100%;
padding: 12px 14px;
border: 1.5px solid var(--card-border);
border-radius: 9px;
font-size: 14px;
font-family: inherit;
color: var(--text-main);
background: #ffffff;
transition: border-color 0.2s, box-shadow 0.2s;
}

.input-wrapper select:focus {
outline: none;
border-color: var(--brand);
box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.15);
}

.fee-preview {
background: var(--brand-soft);
border: 1px solid var(--brand);
border-radius: 9px;
padding: 10px 14px;
font-size: 13px;
color: var(--brand-dark);
margin-bottom: 16px;
display: none;
}
.fee-preview.show { display: block; }
.fee-preview strong { font-size: 15px; }

.checkbox-row {
display: flex;
align-items: flex-start;
gap: 9px;
font-size: 13px;
color: var(--text-sub);
line-height: 1.4;
margin-bottom: 16px;
}
.checkbox-row input[type="checkbox"] {
margin-top: 2px;
width: 16px;
height: 16px;
flex-shrink: 0;
accent-color: var(--brand);
}

.btn-submit {
width: 100%;
background: var(--brand);
color: #ffffff;
border: none;
padding: 13px 18px;
border-radius: 9px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s ease;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
font-family: inherit;
margin-top: 8px;
}

.btn-submit:hover {
background: var(--brand-dark);
transform: translateY(-1px);
box-shadow: 0 4px 12px rgba(18, 78, 102, 0.3);
}

.btn-submit:active {
transform: translateY(0);
}

.alert-box {
padding: 11px 14px;
border-radius: 8px;
font-size: 13px;
margin-bottom: 16px;
display: none;
line-height: 1.4;
}

.alert-box.error {
background: var(--danger-bg);
color: var(--danger);
border: 1px solid #fecaca;
display: block;
}

.alert-box.success {
background: var(--success-bg);
color: var(--success);
border: 1px solid #bbf7d0;
display: block;
}

.back-home {
margin-top: 22px;
text-align: center;
}

.back-home a {
color: #cbd5e1;
font-size: 13.5px;
text-decoration: none;
padding: 8px 16px;
border: 1px solid rgba(255,255,255,0.25);
border-radius: 8px;
transition: all 0.15s;
}

.back-home a:hover {
color: #ffffff;
border-color: rgba(255,255,255,0.5);
background: rgba(255,255,255,0.08);
}

.footer-note {
margin-top: 20px;
color: #94a3b8;
font-size: 12px;
text-align: center;
}
</style>
</head>
<body>

<div class="header-brand">
<div class="emblem">🏥</div>
<h1>Laucala Health Center</h1>
<p>Hospital &amp; Clinical Management Information System</p>
</div>

<div class="login-card">
<div class="card-tabs">
<button class="tab-btn active" id="tab-login" onclick="setTab('login')">Sign In</button>
<button class="tab-btn" id="tab-register" onclick="setTab('register')">Student Register</button>
</div>

<div class="form-container">
<div id="alertBox" class="alert-box"></div>

<!-- SIGN IN FORM -->
<form id="loginForm" onsubmit="handleLogin(event)">
<div class="field-group">
<label for="loginUsername">Student ID or Staff Username</label>
<div class="input-wrapper">
<input type="text" id="loginUsername" required autofocus autocomplete="username" maxlength="200" />
</div>
</div>

<div class="field-group">
<label for="loginPassword">Password</label>
<div class="input-wrapper">
<input type="password" id="loginPassword" required autocomplete="current-password" maxlength="200" />
</div>
</div>

<button type="submit" class="btn-submit" id="loginBtn">
<span>Sign In to Portal</span> →
</button>
</form>

<!-- STUDENT REGISTER FORM -->
<form id="registerForm" style="display:none;" onsubmit="handleRegister(event)" enctype="multipart/form-data">
<div class="field-group">
<label for="regFullName">Full Name</label>
<div class="input-wrapper">
<input type="text" id="regFullName" required maxlength="100" />
</div>
</div>

<div class="field-group">
<label for="regStudentId">Student ID Number</label>
<div class="input-wrapper">
<input type="text" id="regStudentId" placeholder="e.g. S12345678" required
       pattern="^[Ss]\d{8}$" maxlength="9" title="Format: S followed by 8 digits, e.g. S12345678"
       oninput="this.value = this.value.toUpperCase();" />
</div>
</div>

<div class="field-group">
<label for="regPassword">Create Password</label>
<div class="input-wrapper">
<input type="password" id="regPassword" placeholder="6+ characters, letters and numbers" required minlength="6" maxlength="100" />
</div>
</div>

<div class="field-group">
<label for="regMaritalStatus">Marital Status</label>
<div class="input-wrapper">
<select id="regMaritalStatus" required>
<option value="" disabled selected>Select marital status</option>
<option value="Single">Single</option>
<option value="Married">Married</option>
</select>
</div>
</div>

<div class="field-group">
<label for="regCountry">Country</label>
<div class="input-wrapper">
<select id="regCountry" required onchange="updateFeePreview()">
<option value="" disabled selected>Select your country</option>
</select>
</div>
</div>

<div class="fee-preview" id="feePreview"></div>

<div class="field-group">
<label for="regReceipt">Payment Receipt (PDF)</label>
<div class="input-wrapper">
<input type="file" id="regReceipt" accept="application/pdf" required />
</div>
</div>

<button type="submit" class="btn-submit" id="regBtn" style="background:#2e8b57;">
<span>Create Student Account</span> →
</button>
</form>
</div>
</div>

<div class="back-home">
<a href="/">← Back to Home</a>
</div>

<div class="footer-note">
&copy; 2026 Laucala Health Center. Secure Multi-Role Portal.
</div>

<script>
// ---- shared input validation helpers (client-side; the server re-checks everything) ----
const VAL = {
  _last: {},
  // returns false if the same action fired again within ms (stops double-click submits)
  once(key, ms) {
    const now = Date.now();
    if (this._last[key] && now - this._last[key] < (ms || 2000)) return false;
    this._last[key] = now;
    return true;
  },
  today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); },
  vitals(temp, bp) {
    const t = Number(String(temp).trim());
    if (String(temp).trim() === '' || !isFinite(t)) return 'Temperature must be a number in degrees Celsius (e.g. 37.2).';
    if (t < 30 || t > 43) return 'Temperature is out of the valid range (30\u201343 \u00B0C).';
    const m = /^(\d{2,3})\s*\/\s*(\d{2,3})$/.exec(String(bp).trim());
    if (!m) return 'Blood pressure must be in the format systolic/diastolic (e.g. 120/80).';
    const s = parseInt(m[1], 10), d = parseInt(m[2], 10);
    if (s < 60 || s > 250 || d < 40 || d > 150) return 'Blood pressure is out of the valid range (systolic 60\u2013250, diastolic 40\u2013150).';
    if (d >= s) return 'Systolic pressure must be higher than diastolic pressure.';
    return null;
  },
  password(pw, username) {
    if (!pw) return 'A password is required.';
    if (pw.length < 6 || pw.length > 100) return 'Password must be between 6 and 100 characters.';
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Password must contain at least one letter and one number.';
    if (/\s/.test(pw)) return 'Password cannot contain spaces.';
    if (username && pw.toLowerCase() === String(username).toLowerCase()) return 'Password cannot be the same as the username.';
    return null;
  }
};
</script>
<script>
let feeSchedule = null;

function portalPathForRole(role) {
  switch (role) {
    case 'STUDENT': return '/student.html';
    case 'DOCTOR': return '/doctor.html';
    case 'NURSE': return '/checkin.html';
    case 'ADMIN': return '/admin.html';
    default: return '/student.html';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const storedAuth = localStorage.getItem('authHeader');
  const storedRole = localStorage.getItem('userRole');
  if (storedAuth && storedRole) {
    window.location.href = portalPathForRole(storedRole);
    return;
  }
  if (new URLSearchParams(window.location.search).get('reason') === 'idle') {
    showAlert('You were logged out due to inactivity. Please log in again.');
  }
});

fetch('/student/fee-schedule')
  .then(res => res.json())
  .then(data => {
    feeSchedule = data;
    const select = document.getElementById('regCountry');
    for (const country of data.countries) {
      const opt = document.createElement('option');
      opt.value = country;
      opt.textContent = country;
      select.appendChild(opt);
    }
  })
  .catch(() => { feeSchedule = null; });

function updateFeePreview() {
  const country = document.getElementById('regCountry').value;
  const preview = document.getElementById('feePreview');
  if (!country || !feeSchedule) {
    preview.classList.remove('show');
    return;
  }
  const isLocal = country === feeSchedule.localCountry;
  const amount = isLocal ? feeSchedule.localFee : feeSchedule.regionalFee;
  preview.innerHTML = `Laucala Health Services Fee: <strong>FJ$${amount.toFixed(2)}</strong> (${isLocal ? 'Local' : 'Regional'} student rate)`;
  preview.classList.add('show');
}

function setTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
  clearAlert();
  if (!isLogin) {
    document.getElementById('regStudentId').focus();
  } else {
    document.getElementById('loginUsername').focus();
  }
}

function showAlert(msg, isSuccess = false) {
  const box = document.getElementById('alertBox');
  box.textContent = msg;
  box.className = 'alert-box ' + (isSuccess ? 'success' : 'error');
  box.style.display = 'block';
}

function clearAlert() {
  const box = document.getElementById('alertBox');
  box.style.display = 'none';
  box.textContent = '';
}

async function handleLogin(e) {
  e.preventDefault();
  clearAlert();

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');

  if (!username || !password) {
    showAlert('Please enter both username and password.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span>Verifying credentials...</span>';

  try {
    const res = await fetch('/api/check-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!data.ok) {
      showAlert(data.message || 'Invalid username or password.');
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In to Portal</span> →';
      return;
    }

    const authHeader = 'Basic ' + btoa(username + ':' + password);
    localStorage.setItem('authHeader', authHeader);
    localStorage.setItem('currentUser', data.username || username);
    localStorage.setItem('userRole', data.role);

    showAlert(`Welcome back, ${data.username}! Redirecting to ${data.role} portal...`, true);

    setTimeout(() => {
      window.location.href = portalPathForRole(data.role);
    }, 500);

  } catch (err) {
    showAlert('Unable to reach the server. Please check your connection.');
    btn.disabled = false;
    btn.innerHTML = '<span>Sign In to Portal</span> →';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  clearAlert();

  const fullName = document.getElementById('regFullName').value.trim();
  const studentId = document.getElementById('regStudentId').value.trim().toUpperCase();
  const password = document.getElementById('regPassword').value;
  const maritalStatus = document.getElementById('regMaritalStatus').value;
  const country = document.getElementById('regCountry').value;
  const receiptFile = document.getElementById('regReceipt').files[0];
  const btn = document.getElementById('regBtn');

  if (!fullName || !studentId || !password) {
    showAlert('Please provide your full name, Student ID, and password.');
    return;
  }
  if (!/^S\d{8}$/.test(studentId.toUpperCase())) {
    showAlert('Student ID must be in the format S followed by 8 digits (e.g. S12345678).');
    return;
  }
  if (fullName.length > 100) {
    showAlert('Full name must be 100 characters or fewer.');
    return;
  }
  const pwErr = VAL.password(password, studentId);
  if (pwErr) {
    showAlert(pwErr);
    return;
  }
  if (fullName.length < 2 || !/^[\p{L}][\p{L} .'\u2019-]*$/u.test(fullName)) {
    showAlert('Full name must be at least 2 characters and contain only letters, spaces, apostrophes, hyphens or full stops.');
    return;
  }
  if (!maritalStatus) {
    showAlert('Please select your marital status.');
    return;
  }
  if (!country) {
    showAlert('Please select your country.');
    return;
  }
  if (!receiptFile) {
    showAlert('Please attach a PDF receipt to prove you have paid your Laucala Health Services Fee before registering.');
    return;
  }
  if (receiptFile.type !== 'application/pdf') {
    showAlert('The payment receipt must be a PDF file.');
    return;
  }

  if (receiptFile.size === 0 || receiptFile.size > 5 * 1024 * 1024) {
    showAlert('The payment receipt must be a non-empty PDF smaller than 5MB.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span>Creating Account...</span>';

  try {
    const formData = new FormData();
    formData.append('studentId', studentId);
    formData.append('password', password);
    formData.append('fullName', fullName);
    formData.append('maritalStatus', maritalStatus);
    formData.append('country', country);
    formData.append('receipt', receiptFile);

    const res = await fetch('/student/register', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      showAlert(data.error);
      btn.disabled = false;
      btn.innerHTML = '<span>Create Student Account</span> →';
      return;
    }

    setTab('login');
    document.getElementById('loginUsername').value = studentId;
    document.getElementById('loginPassword').value = password;
    showAlert('You have successfully registered! Please log in below.', true);
    btn.disabled = false;
    btn.innerHTML = '<span>Create Student Account</span> →';

  } catch (err) {
    showAlert('Unable to register at this time. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<span>Create Student Account</span> →';
  }
}
</script>

</body>
</html>
