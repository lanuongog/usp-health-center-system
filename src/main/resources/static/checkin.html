<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USP Health Center - Nurse Check-in</title>
<style>
:root {
--bg: #F4F8F8;
--panel: #FFFFFF;
--ink: #14213D;
--ink-soft: #5C7070;
--line: #D8E6E6;
--brand: #0D7377;
--brand-dark: #095558;
--brand-soft: #E3F1F1;
}
* { box-sizing: border-box; }
body {
font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
background: var(--bg);
margin: 0;
color: var(--ink);
}
header {
background: var(--brand);
color: white;
padding: 18px 30px;
font-size: 20px;
font-weight: 600;
}
header a.home-link {
color: #fff; text-decoration: none; opacity: 0.85;
margin-right: 14px; font-size: 14px;
}
header a.home-link:hover { opacity: 1; text-decoration: underline; }
.container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

button {
background: var(--brand); color: white; border: none;
padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px;
}
button:hover { background: var(--brand-dark); }
button.secondary { background: #9ca3af; }
button.secondary:hover { background: #6b7280; }

#app { display: block; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

.panel {
background: var(--panel); border-radius: 10px; padding: 20px; margin-bottom: 20px;
box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.panel h3 { margin-top: 0; color: var(--brand); font-size: 15px; }

.queue-item {
display: flex; justify-content: space-between; align-items: center;
padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px;
}
.queue-item .info strong { color: var(--ink); }
.queue-item .info div { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.urgency-tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
.urgency-tag.Urgent { background: #FFF4E5; color: #8A4B12; }
.urgency-tag.Routine { background: #DCEBFA; color: #17324A; }
.urgency-tag.Emergency { background: #FDEAEA; color: #B03A2E; }

#checkinForm {
display: none; background: white; border-radius: 10px; padding: 20px;
margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
#checkinForm h3 { margin-top: 0; color: #3C7A4E; }
#checkinForm label { display: block; font-size: 13px; color: #374151; margin-top: 12px; margin-bottom: 4px; }
#checkinForm input, #checkinForm textarea {
width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
}
#checkinForm textarea { resize: vertical; min-height: 60px; }
.formActions { margin-top: 16px; display: flex; gap: 10px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
th { color: #6b7280; font-weight: 600; }
</style>
</head>
<body>

<header><a href="/" class="home-link">← Home</a></header>

<div class="container">

<div id="app">
<div class="topbar">
<h2 style="color:#3C7A4E;margin:0;">Check-in Queue</h2>
<button class="secondary" onclick="logout()">Log Out</button>
</div>

<div id="pageError" style="background:#FDEAEA;color:#B03A2E;border:1px solid #f2b8b8;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;"></div>

<div class="panel">
<h3>Students Waiting to be Checked In</h3>
<div id="queueList"></div>
</div>

<div id="checkinForm">
<h3>Check In: <span id="checkinStudentName"></span></h3>
<input type="hidden" id="checkinAppointmentId" />
<label>Temperature (°C)</label>
<input type="text" id="temperature" placeholder="e.g. 37.2" />
<label>Blood Pressure</label>
<input type="text" id="bloodPressure" placeholder="e.g. 120/80" />
<label>Presenting Complaint</label>
<textarea id="presentingComplaint" placeholder="What is the student here for, in their own words..."></textarea>
<div id="formError" style="color:#B03A2E;font-size:13px;margin-top:10px;display:none;"></div>
<div class="formActions">
<button onclick="submitCheckIn()">Complete Check-in</button>
<button class="secondary" onclick="cancelCheckIn()">Cancel</button>
</div>
</div>

<div class="panel">
<h3>Completed Check-ins Today</h3>
<table>
<thead><tr><th>Student</th><th>Temp</th><th>BP</th><th>Complaint</th><th>Time</th></tr></thead>
<tbody id="checkinTableBody"></tbody>
</table>
</div>
</div>

</div>

<script>
let authHeader = null;

window.addEventListener('DOMContentLoaded', () => {
  const storedAuth = sessionStorage.getItem('authHeader');
  const storedRole = sessionStorage.getItem('userRole');

  if (!storedAuth || storedRole !== 'NURSE') {
    window.location.href = '/login.html';
    return;
  }

  authHeader = storedAuth;
  loadQueue();
  loadCheckIns();
});

function logout() {
  sessionStorage.clear();
  window.location.href = '/login.html';
}

function showPageError(message) {
  const box = document.getElementById('pageError');
  box.innerText = message;
  box.style.display = message ? 'block' : 'none';
}

async function loadQueue() {
  const list = document.getElementById('queueList');
  try {
    const res = await fetch('/nurse/queue', { headers: { 'Authorization': authHeader } });
    if (!res.ok) {
      const err = await res.json();
      showPageError(err.message || 'Unable to load patient queue');
      return;
    }
    showPageError(null);
    const appts = await res.json();
    list.innerHTML = '';

    if (appts.length === 0) {
      list.innerHTML = '<p style="color:#9ca3af;font-size:13px;">No students currently waiting.</p>';
      return;
    }

    for (const a of appts) {
      const item = document.createElement('div');
      item.className = 'queue-item';
      item.innerHTML = `
        <div class="info">
          <strong>${escapeHtml(a.studentName)}</strong>
          <span class="urgency-tag ${escapeHtml(a.urgencyLevel)}">${escapeHtml(a.urgencyLevel)}</span>
          <div>${escapeHtml(a.doctorName)} &middot; ${escapeHtml(a.visitReason)}</div>
        </div>
        <button onclick="startCheckIn(${a.id}, this.dataset.name)" data-name="${escapeHtml(a.studentName)}">Check In</button>
      `;
      list.appendChild(item);
    }
  } catch (e) {
    showPageError('Service temporarily unavailable');
  }
}

function startCheckIn(appointmentId, studentName) {
  document.getElementById('checkinAppointmentId').value = appointmentId;
  document.getElementById('checkinStudentName').innerText = studentName;
  document.getElementById('temperature').value = '';
  document.getElementById('bloodPressure').value = '';
  document.getElementById('presentingComplaint').value = '';
  document.getElementById('formError').style.display = 'none';
  document.getElementById('checkinForm').style.display = 'block';
  document.getElementById('checkinForm').scrollIntoView({ behavior: 'smooth' });
}

function cancelCheckIn() {
  document.getElementById('checkinForm').style.display = 'none';
}

function showFormError(message) {
  const box = document.getElementById('formError');
  box.innerText = message;
  box.style.display = message ? 'block' : 'none';
}

async function submitCheckIn() {
  const appointmentId = document.getElementById('checkinAppointmentId').value;
  const temperature = document.getElementById('temperature').value;
  const bloodPressure = document.getElementById('bloodPressure').value;
  const presentingComplaint = document.getElementById('presentingComplaint').value;

  if (!presentingComplaint) {
    showFormError('Missing presenting complaint - this field is required.');
    return;
  }
  if (!temperature || !bloodPressure) {
    showFormError('Display validation messages for incomplete vital information.');
    return;
  }

  try {
    const res = await fetch('/nurse/checkin', {
      method: 'POST',
      headers: { 'Authorization': authHeader, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        appointmentId: parseInt(appointmentId),
        temperature, bloodPressure, presentingComplaint
      })
    });

    if (!res.ok) {
      const err = await res.json();
      showFormError(err.message || 'Unable to save check-in.');
      return;
    }

    showFormError(null);
    document.getElementById('checkinForm').style.display = 'none';
    loadQueue();
    loadCheckIns();
  } catch (e) {
    showFormError('Service temporarily unavailable');
  }
}

async function loadCheckIns() {
  try {
    const res = await fetch('/nurse/checkins', { headers: { 'Authorization': authHeader } });
    if (!res.ok) return;
    const checkins = await res.json();
    const body = document.getElementById('checkinTableBody');
    body.innerHTML = '';

    if (checkins.length === 0) {
      body.innerHTML = '<tr><td colspan="5" style="color:#9ca3af;">No check-ins completed yet.</td></tr>';
      return;
    }

    for (const c of checkins) {
      const row = document.createElement('tr');
      const name = c.appointment ? c.appointment.studentName : 'Unknown';
      const time = c.checkInTime ? new Date(c.checkInTime).toLocaleTimeString() : '';
      row.innerHTML = `
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(c.temperature)}</td>
        <td>${escapeHtml(c.bloodPressure)}</td>
        <td>${escapeHtml(c.presentingComplaint)}</td>
        <td>${escapeHtml(time)}</td>
      `;
      body.appendChild(row);
    }
  } catch (e) {
    // non-critical
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}
</script>

</body>
</html>
